[project]
name = "continual-go"
version = "0.1.0"
description = "A big world environment for continual reinforcement learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dm-haiku>=0.0.16",
    "flax>=0.12.6",
    "jax>=0.9.2",
    "jaxtyping>=0.3.9",
    "matplotlib>=3.10.8",
    "mctx>=0.0.6",
    "numpy>=2.4.3",
    "pydantic>=2.13.4",
]

[tool.uv.workspace]
members = [
    "alpha_zero",
    ".",
    "plots",
]

[tool.ruff.lint]
ignore = ["F722"]
